[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Enterprise Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.jolpi.ca https://v1.formula-1.api-sports.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    
    # HSTS - Force HTTPS with preload
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Clickjacking protection
    X-Frame-Options = "DENY"
    
    # MIME-sniffing prevention
    X-Content-Type-Options = "nosniff"
    
    # Legacy XSS filter protection
    X-XSS-Protection = "1; mode=block"
    
    # Referrer privacy protection
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Restrict unneeded browser hardware APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=(), interest-cohort=()"
    
    # Cross-Origin Isolation
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
